experimental:
  docker:
    nodes:
    - name: "worker-1"
      env:
        - "NODE_ROLE=worker"
    - name: "worker-2"
      env:
        - "NODE_ROLE=worker"
  deploy:
    vcluster:
      helm:
        - chart:
            name: ingress-nginx
            repo: https://kubernetes.github.io/ingress-nginx
            version: 4.14.1
          values: |-
            controller:
              service:
                type: LoadBalancer
              ingressClassResource:
                default: true
              admissionWebhooks:
                enabled: false
                patch:
                  enabled: false
          release:
            name: ingress-nginx
            namespace: ingress-nginx
        - chart:
            name: vcluster-platform
            repo: https://charts.loft.sh/
            version: 4.7.0-rc.4
          values: |-
            config:
              # only uncomment if you have your own FQDN to use for vCluster Platform
              # loftHost: "<your-fully-qualifed-domain-name>"
              costControl:
                enabled: false
              imageBuilder:
                enabled: false
          release:
            name: vcluster-platform
            namespace: vcluster-platform