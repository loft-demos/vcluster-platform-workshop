apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: auto-nodes
spec:
  displayName: Auto Nodes
  owner:
    user: admin
  template:
    metadata: {}
    instanceTemplate:
      metadata: {}
    pro:
      enabled: true
    helmRelease:
      chart:
        version: 0.32.0
      values: |
        privateNodes:
          enabled: true
          autoNodes:
            - provider: pod-auto-nodes
              properties:
                test: blue
              dynamic:
                - name: node-pool-1
                  limits:
                    nodes: "{{.Values.autoNodeCount}}"
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
    accessPoint:
      ingress: {}
    spaceTemplate:
      metadata: {}
  parameters:
    - variable: autoNodeCount
      label: Auto Nodes Limit
      description: Maximum number of auto-provisioned nodes for node-pool-1.
      type: string
      required: true
      value: "3"
      options:
        - "1"
        - "3"
        - "5"
      validation: ^(1|3|5)$
