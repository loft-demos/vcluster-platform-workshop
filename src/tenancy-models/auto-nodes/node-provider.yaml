apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: pod-auto-nodes
spec:
  terraform:
    nodeTemplate:
      git:
        repository: https://github.com/loft-demos/vcluster-platform-workshop.git
        subPath: src/tenancy-models/auto-nodes/node
    nodeEnvironmentTemplate:
      infrastructure:
        git:
          repository: https://github.com/loft-demos/vcluster-platform-workshop.git
          subPath: src/tenancy-models/auto-nodes/environment/infrastructure
    nodeTypes:
      - resources:
          cpu: '500m'
          memory: 1Gi
          pods: '10'
        name: a-small
        metadata: {}
      - resources:
          cpu: '1'
          memory: 2Gi
          pods: '20'
        name: b-medium
        metadata: {}
      - resources:
          cpu: '2'
          memory: 4Gi
          pods: '30'
        name: c-large
        metadata: {}
  displayName: Pod Auto Nodes
