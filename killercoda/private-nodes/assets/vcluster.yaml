experimental:
  docker:
    nodes:
    - name: "worker-1"
      env:
        - "NODE_ROLE=worker"
  deploy:
    vcluster:
      helm:
        - chart:
            name: vcluster-platform
            repo: https://charts.loft.sh/
            version: 4.7.0
          values: |-
            config:
              # only uncomment if you have your own FQDN to use for vCluster Platform
              # loftHost: "<your-fully-qualifed-domain-name>"
              costControl:
                enabled: false
              imageBuilder:
                enabled: false
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
          release:
            name: vcluster-platform
            namespace: vcluster-platform
